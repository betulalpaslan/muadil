services:
  postgres:
    image: postgres:17
    container_name: muadil-web-postgres
    environment:
      POSTGRES_USER: muadil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: muadil
    ports:
      - "5433:5432"
    volumes:
      - muadil-web-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muadil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  muadil-web-pg:
